:root{
  --bg:#E9EDEA; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#17201C; --ink-2:#56635D; --ink-3:#86918C; --line:#DCE3DF;
  --brand:#22513D; --brand-2:#2F6B51; --brand-soft:#DCEBE2; --on-brand:#FFFFFF;
  --veg:#3A8656; --veg-soft:#E1F0E6;
  --pro:#BC4A34; --pro-soft:#F7E4DE;
  --carb:#A87A0C; --carb-soft:#F5ECD2;
  --snk:#4C66A3; --snk-soft:#E3E8F5;
  --free:#9E3A68; --free-soft:#F4E1EA;
  --bad:#B3261E; --bad-soft:#FADFDB; --warn:#7F5300; --warn-soft:#F8ECCB;
  --shadow:0 1px 0 rgba(23,32,28,.04),0 6px 18px -8px rgba(23,32,28,.18); --toast-act:#9FD9B8;
  --f-ui:"Plex Hebrew",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --f-num:"Plex Hebrew",system-ui,sans-serif; --f-disp:"Karantina","Plex Hebrew",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614; --surface:#1A211E; --surface-2:#222B27; --ink:#E8EFEB; --ink-2:#A9B6B0; --ink-3:#7A8781; --line:#2C3632;
  --brand:#7CC79E; --brand-2:#93D4B0; --brand-soft:#1E3529; --on-brand:#0E1A14;
  --veg:#74C78F; --veg-soft:#1B3123;
  --pro:#F08C74; --pro-soft:#3A221C;
  --carb:#E2B547; --carb-soft:#352A10;
  --snk:#9DB3EA; --snk-soft:#1E2740;
  --free:#E489B4; --free-soft:#3A1E2C;
  --bad:#FF8A7D; --bad-soft:#3B1C19; --warn:#F0C35C; --warn-soft:#33290F;
  --shadow:none; --toast-act:#22513D; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:10px}
svg{flex:none}
.num{font-family:var(--f-num);font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:560px;margin:0 auto}
.dayhead{display:flex;align-items:center;gap:6px}
.dayhead .when{flex:1;display:flex;align-items:center;gap:12px;min-width:0;position:relative}
.dayhead .dnum{font-size:44px;line-height:1;color:var(--ink);letter-spacing:-1.5px}
.dayhead .dtxt b{display:block;font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1;letter-spacing:.2px}
.dayhead .dtxt b.ui{font-family:var(--f-ui);font-size:19px;font-weight:600;line-height:1.25;letter-spacing:0}
.dayhead .dtxt small{display:block;font-size:13px;color:var(--ink-2)}
.dayhead input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);box-shadow:var(--shadow)}
.ibtn svg{width:20px;height:20px}
.chip-today{height:32px;padding:0 12px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:13px;font-weight:600}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 7px;border-radius:14px;color:var(--ink-2)}
.wd small{font-size:11.5px;font-weight:500}
.wd .num{font-family:var(--f-ui);font-weight:600;font-size:18px;line-height:1.1;color:var(--ink);letter-spacing:0}
.wd .pips{display:flex;gap:3px;height:6px}
.wd .pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.wd .pips i.on{background:var(--brand-2)}
.wd .pips i.bad{background:var(--bad)}
.wd.today small{color:var(--brand);font-weight:700}
.wd.sel{background:var(--surface);box-shadow:var(--shadow)}
.wd.future .num{color:var(--ink-3)}
.pagehead{display:flex;align-items:center;gap:8px}
.pagehead h1{flex:1;margin:0;font-size:36px;line-height:1;font-family:var(--f-disp);font-weight:700}
.pagehead .sub{font-size:13px;color:var(--ink-2);font-weight:500}

main{max-width:560px;margin:0 auto;padding:6px 16px calc(96px + env(safe-area-inset-bottom))}

/* ---------- notices ---------- */
.notice{display:flex;gap:10px;align-items:center;border-radius:14px;padding:11px 14px;margin:6px 0 12px;font-size:14px;font-weight:500}
.notice svg{width:18px;height:18px}
.notice span{flex:1}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice .btn{flex:none}

/* ---------- timeline ---------- */
.tl{position:relative;padding-right:38px;margin-top:4px}
.tl::before{content:"";position:absolute;top:22px;bottom:34px;right:15px;width:2px;background:var(--line);border-radius:2px}
.node{position:relative;margin-bottom:14px}
.node .pin{position:absolute;right:-38px;top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink-3);box-shadow:inset 0 0 0 2px var(--line)}
.node .pin svg{width:16px;height:16px}
.node.done .pin{background:var(--brand);color:var(--on-brand);box-shadow:none}
.node.active .pin{color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.mhead{display:flex;align-items:baseline;gap:8px;padding:14px 16px 8px}
.mhead h2{margin:0;font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1;flex:1;letter-spacing:.2px}
.mhead .hint{font-size:13px;color:var(--ink-2);font-weight:500}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.mnote{font-size:13px;color:var(--ink-2);padding:0 16px 10px;margin:0}

/* rows */
.rows{border-top:1px solid var(--line)}
.r{--c:var(--brand);display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 16px;border-bottom:1px solid var(--line);position:relative}
.r:last-child{border-bottom:0}
.r::before{content:"";position:absolute;right:0;top:12px;bottom:12px;width:3px;border-radius:3px 0 0 3px;background:var(--c);opacity:.9}
.r.veg{--c:var(--veg)} .r.pro{--c:var(--pro)} .r.carb{--c:var(--carb)} .r.snk{--c:var(--snk)}
.r .k{width:64px;flex:none;font-size:13px;font-weight:600;color:var(--c)}
.r .v{flex:1;min-width:0}
.r .v b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.r .v small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.35;margin-top:1px}
.r .v .ph{font-size:15px;color:var(--ink-3);font-weight:500}
.r .amt{flex:none;display:flex;align-items:baseline;gap:3px;color:var(--ink)}
.r .amt .num{font-size:23px;line-height:1}
.r .amt i{font-style:normal;font-size:12.5px;color:var(--ink-2);font-weight:500}
.r .amt.txt{font-size:13px;font-weight:600;max-width:96px;text-align:left;line-height:1.3}
.r .add{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--c)}
.r .add svg{width:16px;height:16px}
.r:active{background:var(--surface-2)}
.r.static:active{background:none}

/* fast */
.fast{padding:14px 16px}
.fast-top{display:flex;align-items:center;gap:10px}
.fast-top h2{margin:0;font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1;flex:1;letter-spacing:.2px}
.timesel{display:flex;align-items:center;gap:4px;direction:ltr}
.timesel select,.tin{appearance:none;-webkit-appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-family:var(--f-ui);font-weight:600;font-size:19px;line-height:1.1;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.timesel b{font-size:18px;color:var(--ink-3)}
.tin{font-size:17px;padding:6px 8px;min-width:96px}
.fstate{margin-top:12px;display:flex;align-items:center;gap:12px}
.fstate .num{font-size:22px;line-height:1;color:var(--brand)}
.fstate p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.35}
.fstate p b{color:var(--ink);font-weight:600}
.fbar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.fbar i{display:block;height:100%;background:var(--brand-2);border-radius:6px}
.fnote{margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.toggles{margin-top:12px;border-top:1px solid var(--line)}
.tg{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0 2px;font-size:15px;font-weight:500}
.tg span{flex:1}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
[aria-checked=true] .sw{background:var(--brand-2)}
[aria-checked=true] .sw::after{transform:translateX(-18px)}

/* loading extras */
.lrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:14.5px;flex-wrap:wrap}
.lrow label{font-weight:500}
.win{font-size:13px;font-weight:600;color:var(--carb);background:var(--carb-soft);padding:3px 10px;border-radius:999px}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink-2);text-align:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lrow .seg{flex:1}

/* journal */
.sec-t{font-size:15px;font-weight:600;color:var(--ink-2);margin:26px 2px 10px}
.jcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.jhead{display:flex;align-items:center;gap:10px}
.jhead h3{margin:0;font-size:16px;font-weight:600;flex:1}
.free-big{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.free-big .num{font-size:50px;line-height:.9;color:var(--free);letter-spacing:-2px}
.free-big .num.neg{color:var(--bad)}
.free-big p{margin:0 0 4px;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.free-big p b{color:var(--ink);font-weight:600}
.fmeter{display:flex;height:8px;border-radius:8px;overflow:hidden;background:var(--surface-2);margin-top:14px}
.fmeter i{display:block;height:100%}
.fmeter .u{background:var(--free)}
.fmeter .o{background:var(--bad)}
.entries{list-style:none;margin:12px 0 0;padding:0}
.entries li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.entries li span{flex:1;min-width:0}
.entries li .num{font-size:17px;line-height:1}
.entries .del{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.entries .del svg{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:12px;font-size:14.5px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;height:48px;font-size:16px}
.btn.line{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:none;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad-soft)}
.jfoot{margin-top:12px;display:flex;gap:8px}
.milk{margin-top:12px}
.milk .seg button{font-weight:600;font-size:15px;padding:8px 4px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--brand);padding:8px 14px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500;color:var(--ink)}
.chip small{color:var(--ink-3);font-size:12px;font-weight:400}
.chip.on{background:var(--c);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:var(--on-brand)}}
.chip.on small{color:inherit;opacity:.8}
.lbl{font-size:13px;color:var(--ink-2);font-weight:500;margin:14px 0 8px}
.empty{font-size:14px;color:var(--ink-3);margin:8px 0 0}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;gap:4px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;color:var(--ink-3);font-size:12px;font-weight:500}
nav.tabs svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs button.on svg{transform:translateY(-1px)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s linear .3s}
.sheet.open{transform:none;visibility:visible;transition:transform .3s var(--ease)}
.sh-top{padding:10px 18px 0;flex:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-head h2{margin:0;flex:1;font-size:22px;font-weight:600;line-height:1.25}
.sh-head h2 small{display:block;font-size:13px;color:var(--ink-2);font-weight:500;margin-top:2px}
.sh-close{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.sh-close svg{width:18px;height:18px}
.sh-body{overflow-y:auto;padding:4px 18px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sh-foot{flex:none;padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.tabs-x{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px;margin:14px 0 4px}
.tabs-x::-webkit-scrollbar{display:none}
.tabs-x button{padding:9px 4px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink-2);text-align:center;white-space:nowrap}
.tabs-x button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.olist{margin-top:6px}
.ogrp{font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 2px 4px}
.opt{--c:var(--brand);display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);min-height:60px}
.opt:last-child{border-bottom:0}
.opt .v{flex:1;min-width:0}
.opt .v b{display:block;font-size:16px;font-weight:500;line-height:1.3}
.opt .v small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.opt .amt{display:flex;align-items:baseline;gap:3px}
.opt .amt .num{font-size:21px;line-height:1}
.opt .amt i{font-style:normal;font-size:12.5px;color:var(--ink-2)}
.opt .amt.txt{font-size:13px;font-weight:600;max-width:110px;text-align:left}
.opt .tick{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent;flex:none}
.opt .tick svg{width:14px;height:14px}
.opt.on .tick{background:var(--c);box-shadow:none;color:#fff}
.opt.on .v b{font-weight:600}
.opt:active{background:var(--surface-2)}
.vmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.vm{border-radius:16px;padding:12px 10px 10px;background:var(--surface-2);text-align:center;box-shadow:inset 0 0 0 1.5px transparent}
.vm .num{display:block;font-size:26px;line-height:1;color:var(--ink)}
.vm .num i{font-style:normal;font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--ink-2)}
.vm b{display:block;font-size:14px;font-weight:600;margin-top:4px}
.vm small{display:block;font-size:11.5px;color:var(--ink-2)}
.vm.on{background:var(--veg-soft);box-shadow:inset 0 0 0 2px var(--veg)}
.vm.on .num{color:var(--veg)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field input{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:17px;outline:none}
.field input:focus{border-color:var(--brand)}
.field input.big{font-family:var(--f-num);font-weight:700;font-size:30px;padding:8px 14px}
.dangerzone{margin-top:18px;text-align:center}

/* ---------- week ---------- */
.wsum{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 4px}
.wsum div{text-align:center;border-left:1px solid var(--line);padding:0 4px}
.wsum div:last-child{border-left:0}
.wsum .num{display:block;font-size:28px;line-height:1}
.wsum small{display:block;font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.25}
.wsum .ok{color:var(--brand)} .wsum .bad{color:var(--bad)}
.grid{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin-top:12px;padding:12px 10px 8px}
.grid table{width:100%;border-collapse:collapse;table-layout:fixed}
.grid th{font-size:12px;font-weight:500;color:var(--ink-2);padding:0 0 8px}
.grid th.rh{width:62px;text-align:right;padding-right:4px}
.grid th .num{display:block;font-family:var(--f-ui);font-weight:600;font-size:15px;color:var(--ink);line-height:1.3}
.grid th.today .num,.grid th.today{color:var(--brand)}
.grid td{text-align:center;padding:5px 0;border-top:1px solid var(--line)}
.grid td.rh{text-align:right;font-size:12.5px;font-weight:500;color:var(--ink-2);padding-right:4px}
.dotc{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;box-shadow:inset 0 0 0 2px var(--line)}
.dotc.ok{background:var(--brand-2);box-shadow:none}
.dotc.half{background:linear-gradient(270deg,var(--brand-2) 50%,transparent 50%);box-shadow:inset 0 0 0 2px var(--brand-2)}
.dotc.ld{background:var(--carb);box-shadow:none}
.dotc.bad{background:var(--bad);box-shadow:none}
.dotc.na{box-shadow:none;background:none}
.grid button{width:100%;padding:4px 0}
.dlist{margin-top:12px}
.dcard{display:block;width:100%;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
.dcard .t{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dcard .t .num{font-size:22px;line-height:1}
.dcard .t b{flex:1;font-size:15px;font-weight:600}
.dcard .t .pill{margin-right:4px}
.dl{display:flex;gap:10px;font-size:13.5px;padding:3px 0;line-height:1.4}
.dl span{width:52px;flex:none;color:var(--ink-3);font-weight:500}
.dl em{font-style:normal;color:var(--ink)}
.dl em.miss{color:var(--ink-3)}
.dl em.bad{color:var(--bad)}

/* ---------- rules ---------- */
.banner{display:flex;gap:10px;align-items:center;background:var(--bad-soft);color:var(--bad);border-radius:16px;padding:13px 16px;font-weight:600;font-size:15px;margin:4px 0 14px}
.banner svg{width:20px;height:20px}
.rg{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 4px;margin-bottom:12px}
.rg h3{margin:0 0 6px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.rg h3 i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--brand));display:inline-block}
.rg dl{margin:0;display:grid;grid-template-columns:96px 1fr}
.rg dt,.rg dd{padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.rg dt{font-weight:600;color:var(--ink)}
.rg dd{margin:0;color:var(--ink-2);padding-right:10px}
.rg dd b{color:var(--ink);font-weight:600}
.rg dt:first-of-type,.rg dd:first-of-type{border-top:0}
.qt{width:100%;border-collapse:collapse;margin-bottom:6px}
.qt th{font-size:12px;color:var(--ink-2);font-weight:500;text-align:left;padding:4px 0 6px;width:58px}
.qt th:first-child{text-align:right;width:auto}
.qt td{border-top:1px solid var(--line);padding:8px 0;font-size:14px;vertical-align:baseline}
.qt td.q{text-align:left;font-weight:700;font-size:15.5px;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.qt td.q.t{font-family:var(--f-ui);font-size:12px;font-weight:600;white-space:normal}
.qt td.q.na{color:var(--ink-3);font-family:var(--f-ui);font-size:13px;font-weight:400}
.qt td small{display:block;font-size:12px;color:var(--ink-2)}
.vlist{font-size:14px;line-height:1.7;color:var(--ink-2);margin:0 0 10px}
.vlist b{color:var(--ink)}

/* ---------- backup ---------- */
.bstat{display:flex;gap:16px;align-items:flex-end;margin:8px 0 14px}
.bstat .num{font-size:46px;line-height:.9;letter-spacing:-2px}
.bstat p{margin:0 0 4px;font-size:14px;color:var(--ink-2)}
.bstat p b{color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{font-size:13.5px;color:var(--ink-2);margin:0;line-height:1.5}

/* ---------- fast ring ---------- */
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--surface-2);stroke-width:7}
.ring .prg{fill:none;stroke:var(--brand-2);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.ring .rin{position:absolute;inset:0;display:grid;place-items:center;color:var(--brand)}
.ring .rin .num{font-size:22px;line-height:1}
.ring .rin svg{width:30px;height:30px;transform:none}
/* ---------- copy yesterday / recent ---------- */
.copy{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:0 16px 12px;padding:10px 12px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--brand-soft);background:none;text-align:right}
.copy svg{width:18px;height:18px;color:var(--brand)}
.copy span{flex:1;min-width:0}
.copy b{display:block;font-size:14px;font-weight:600;color:var(--brand)}
.copy small{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:14px;background:var(--surface-2);text-align:right}
.recent button b{font-size:14px;font-weight:600}
.recent button small{font-size:12px;color:var(--ink-2)}
.recent button.on{box-shadow:inset 0 0 0 2px var(--pro)}
/* ---------- streak ---------- */
.streak{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.streak .num{font-size:50px;line-height:.9;color:var(--brand);letter-spacing:-2px}
.streak .st-t{flex:1}
.streak .st-t b{display:block;font-size:16px;font-weight:600}
.streak .st-t small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.streak .best{text-align:center;padding-right:14px;border-right:1px solid var(--line)}
.streak .best .num{font-size:24px;color:var(--ink);letter-spacing:-.5px}
.streak .best small{display:block;font-size:12px;color:var(--ink-2)}
/* ---------- month calendar ---------- */
.calnav{display:flex;align-items:center;gap:8px;margin:12px 0 10px}
.calnav b{flex:1;text-align:center;font-size:17px;font-weight:600}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg .h{font-size:12px;color:var(--ink-2);font-weight:500;padding-bottom:4px}
.cd{position:relative;aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:var(--ink)}
.cd.out{visibility:hidden}
.cd.fut{color:var(--ink-3)}
.cd.full{background:var(--brand-soft);color:var(--brand);font-weight:600}
.cd.part{box-shadow:inset 0 0 0 1.5px var(--brand-soft)}
.cd.today{box-shadow:inset 0 0 0 2px var(--brand)}
.cd.sel{background:var(--ink);color:var(--surface)}
.cd i{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.cd i.ld{background:var(--carb);left:calc(50% - 8px)}
.calkey{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.calkey span{display:flex;align-items:center;gap:6px}
.calkey i{width:12px;height:12px;border-radius:4px;display:inline-block}
.when.btnlike{cursor:pointer}
/* day paging animation */
@media (prefers-reduced-motion:no-preference){
  main.anim-next{animation:dayNext .26s var(--ease)}
  main.anim-prev{animation:dayPrev .26s var(--ease)}
}
@keyframes dayNext{from{opacity:.3;transform:translateX(-40px)}}
@keyframes dayPrev{from{opacity:.3;transform:translateX(40px)}}
.restore p{margin:14px 0 0;font-size:15px;line-height:1.5}
.restore p b{font-weight:600}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:60;white-space:nowrap;display:flex;align-items:center;gap:14px}
.toast button{color:var(--toast-act);font-weight:600;font-size:14px;padding:4px 2px}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.r .k{width:54px}.r .amt .num{font-size:20px}.dayhead .dnum{font-size:38px}}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="head"></div></header>
<main id="view"></main>
<nav class="tabs" aria-label="ניווט"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
"use strict";
/* =========================================================
   נתוני התפריט
   ========================================================= */
const RAW='לפני בישול', COOKED='אחרי בישול', DRAINED='אחרי סינון';
const VEG={
  color:{label:'צבעוניים',g:225,items:['פלפל','כרוב','כרובית','קולורבי','בצל','גזר','סלק','צנונית','שום','שומר','כרישה','חציל','שעועית צהובה','פטריות','ארטישוק']},
  green:{label:'ירוקים',g:375,items:['פטרוזיליה','כוסברה','נענע','בזיליקום','שמיר','רוקט','מנגולד','עלי בייבי','נבטי ברוקולי','נבטי אלפלפא','נבטי מש','חסה','תרד','עגבנייה','שעועית ירוקה','קישוא','זוקיני','אספרגוס']}
};
const UNLIMITED_VEG=['פטריות'];
const FISH=['בקלה','הליבוט','אמנון','סוך','נסיכת הנילוס','לברק','דניס','ברבוניה','ברמונדי','מרלוז'];
const LEAN=[['chk_breast','חזה עוף',RAW],['chk_fillet','פילה עוף',RAW],['turkey','חזה הודו',RAW],['pastrami','פסטרמה עד 3%',''],['beef_shoulder','כתף בקר',RAW],['shaitel','שייטל',RAW]];
const it=(id,n,a,w,x)=>({id,n,a,w:w||'',x:x||''});
function proteinGroups(m){
  return [
    {g:'בשר רזה',t:'בשר רזה',items:LEAN.map(([id,n,w])=>it(id,n,m.meat+' ג׳',w))},
    {g:'דגים וטונה',t:'דגים',items:[it('lean_fish','דג רזה',m.fish+' ג׳',RAW,'בקלה, הליבוט, אמנון, דניס, מרלוז ועוד'),it('tuna_water','טונה במים',m.tuna+' ג׳',DRAINED)]},
    {g:'מוצרי חלב',t:'מוצרי חלב',items:[
      it('labane','לאבנה עד 5%',m.labane+' ג׳'),

  const n=new Date(),t=new Date(),w=new Date(); t.setHours(a,b,0,0); w.setHours(wa,wb,0,0);
  if(n<w)return{html:`<div class="fstate"><p>ארוחה ראשונה מ-<b>${al}</b></p></div>`};
  const left=Math.round((t-n)/60000);
  if(left>0){const pct=Math.min(100,Math.max(0,100-left/(FAST_H*60)*100));
    return{active:true,html:`<div class="fstate">${ring(pct,`<span class="num">${Math.floor(left/60)}:${pad(left%60)}</span>`)}<p>נותרו לצום<br>אוכלים מ-<b>${al}</b></p></div>`}}
  return{done:true,html:`<div class="fstate">${ring(100,I.check)}<p>הצום הסתיים ב-<b>${al}</b>.<br>אפשר לאכול.</p></div>`};
}
function wakeSel(w){

function ydayMeal(meal){

function recentFor(path,n=4){
  const cnt={},last={},groups=CAT[path]; let d=addD(cur,-1);
  for(let i=0;i<28;i++,d=addD(d,-1)){const raw=S.days[d]; if(!raw)continue; const id=getP(raw,path);
    if(id&&findIn(groups,id)){cnt[id]=(cnt[id]||0)+1; if(last[id]==null)last[id]=i}}
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||last[a]-last[b]).slice(0,n);
}

      `<button class="btn line block" data-act="calpick" data-val="${t}">${s.target==='day'?'להיום':'לשבוע הנוכחי'}</button>`);
  }else if(s.type==='restore'){
    const inc=Object.keys(s.data.days||{}), fresh=inc.filter(k=>!S.days[k]).length;
    html=shell('שחזור מגיבוי','',`<div class="restore"><p>בקובץ <b>${inc.length}</b> ימים. <b>${fresh}</b> מהם לא קיימים בטלפון.</p>
      <p class="muted">מיזוג מוסיף רק ימים חסרים, וימים שכבר קיימים כאן נשארים כמו שהם. החלפה מוחקת את מה שיש בטלפון ושמה במקומו את הקובץ.</p></div>`,
      `<div class="stack"><button class="btn pri block" data-act="rmerge">מיזוג: הוספת ${fresh} ימים חסרים</button><button class="btn danger block" data-act="rreplace">החלפה מלאה</button></div>`);
  }else if(s.type==='dev'){
    html=shell('חריגה מהתפריט','מה היה?',`<form id="devForm"><div class="field"><label for="dv">תיאור</label><input id="dv" type="text" placeholder="למשל: פרוסת עוגה באירוע" enterkeyhint="done" autofocus></div></form>`,'<button class="btn pri block" data-act="devsave">רישום</button>');
  }
  sheetEl.innerHTML=html;
  const b=sheetEl.querySelector('.sh-body'); if(b&&scroll)b.scrollTop=scroll;
}

/* =========================================================
   מסך שבוע
   ========================================================= */
function viewWeek(){
  const t=today(), days=[...Array(7)].map((_,i)=>addD(wk,i)), recs=days.map(getDay);
  const loads=recs.filter(r=>r.loadingToday&&loadDone(r)).length;
  const devs=recs.reduce((s,r)=>s+r.dev.length,0);
  const fused=recs.reduce((s,r)=>s+freeUsed(r),0);
  const full=days.filter((d,i)=>hasAny(d)&&lunchDone(recs[i])&&dinnerDone(recs[i])).length;
  const sk=streaks();
  let h=`<div class="streak"><span class="num">${sk.c}</span><span class="st-t"><b>${sk.c===1?'יום ברצף':'ימים ברצף'} לפי התפריט</b><small>צהריים וערב סומנו, בלי חריגות ובלי לחרוג מהקלוריות החופשיות</small></span><span class="best"><span class="num">${sk.best}</span><small>שיא</small></span></div>
  <div class="wsum">
    <div><span class="num ${full?'ok':''}">${full}</span><small>ימים מלאים<br>מתוך 7</small></div>
    <div><span class="num ${loads===1?'ok':loads>1?'bad':''}">${loads===1?'✓':loads}</span><small>העמסה</small></div>
    <div><span class="num ${devs?'bad':''}">${devs}</span><small>חריגות</small></div>
    <div><span class="num">${fused}</span><small>קל׳ חופשיות</small></div></div>`;
  if(loads>1)h+=`<div class="notice bad" style="margin-top:12px">${I.alert}<span>יותר מהעמסה אחת השבוע.</span></div>`;
  const cell=(d,r,k)=>{
    if(!hasAny(d))return'<i class="dotc na"></i>';
    if(k==='l')return`<i class="dotc ${lunchDone(r)?'ok':(r.lunch.protein||r.lunch.veg.mode)?'half':''}"></i>`;
    if(k==='s')return r.snack.opt?'<i class="dotc ok"></i>':'<i class="dotc"></i>';
    if(k==='d'){if(r.loadingToday)return`<i class="dotc ${loadDone(r)?'ld':''}"></i>`;return`<i class="dotc ${dinnerDone(r)?'ok':(r.dinner.protein||r.dinner.carb||r.dinner.veg.mode)?'half':''}"></i>`}
    if(k==='x')return r.dev.length?'<i class="dotc bad"></i>':'<i class="dotc na"></i>';
  };
  h+=`<div class="grid"><table><thead><tr><th class="rh"></th>${days.map((d,i)=>`<th class="${d===t?'today':''}"><button data-act="open" data-val="${d}">${DLET[i]}<span class="num">${pd(d).getDate()}</span></button></th>`).join('')}</tr></thead><tbody>
    ${[['l','צהריים'],['s','ביניים'],['d','ערב'],['x','חריגות']].map(([k,n])=>`<tr><td class="rh">${n}</td>${days.map((d,i)=>`<td><button data-act="open" data-val="${d}" aria-label="${n} ביום ${DAYS[i]}">${cell(d,recs[i],k)}</button></td>`).join('')}</tr>`).join('')}
  </tbody></table></div>`;
  h+='<div class="dlist">';
  days.forEach((d,i)=>{
    const r=recs[i], any=hasAny(d);
    if(!any&&d>t)return;
    const L=(k,v,cls='')=>`<div class="dl"><span>${k}</span><em class="${cls}">${v}</em></div>`;
    let body='';
    if(!any)body=L('','לא תועד','miss');
    else{
      const lp=label(r,'lunch.protein'), lv=vegInfo(r.lunch.veg);
      body+=L('צהריים',lp||lv?esc([lp&&lp.n,lv&&lv.n].filter(Boolean).join(', ')):'לא סומן',lp||lv?'':'miss');
      const sn=SNACKS.find(x=>x.id===r.snack.opt);
      if(sn){const subN=sn.sub&&r.snack.sub?(sn.sub.find(x=>x.id===r.snack.sub)||{}).n:'';body+=L('ביניים',esc([subN||sn.n,r.snack.green].filter(Boolean).join(', ')))}
      if(r.loadingToday){const lo=r.loading.mode==='out'?[label(r,'loading.out')]:[label(r,'loading.protein'),label(r,'loading.carb')];const t2=lo.filter(Boolean).map(x=>x.n).join(', ');body+=L('העמסה',t2?esc(t2):'לא סומן',t2?'':'miss')}
      else{const dp=label(r,'dinner.protein'),dc=label(r,'dinner.carb'),dv=vegInfo(r.dinner.veg);const t2=[dp&&dp.n,dc&&dc.n,dv&&dv.n].filter(Boolean).join(', ');body+=L('ערב',t2?esc(t2):'לא סומן',t2?'':'miss')}
      const fu=freeUsed(r), ex=[r.milk?`חלב ${r.milk} מ״ל`:'',fu?`${fu} קל׳ חופשיות`:''].filter(Boolean).join(', ');
      if(ex)body+=L('עוד',esc(ex));
      if(r.dev.length)body+=L('חריגות',esc(r.dev.join(', ')),'bad');
    }
    const tags=[r.training?'<span class="pill">אימון</span>':'',r.loadingToday?'<span class="pill ok">העמסה</span>':''].join('');
    h+=`<button class="dcard" data-act="open" data-val="${d}"><div class="t"><span class="num">${pd(d).getDate()}</span><b>יום ${DAYS[i]}${d===t?', היום':''}</b>${tags}</div>${body}</button>`;
  });
  return h+'</div>';
}

let rulesTab='rules';
function rg(title,c,rows){return`<div class="rg" style="--c:var(${c})"><h3><i></i>${title}</h3><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`}
function qtable(title,c,cols,groupsList){
  // groupsList: array per column of groups; union by id keeping first order
  const order=[],seen={};
  groupsList.forEach(gs=>gs&&gs.forEach(g=>g.items.forEach(o=>{if(!seen[o.id]){seen[o.id]=o;order.push(o)}})));
  const cellOf=(gs,id)=>{const o=findIn(gs,id);if(!o)return'<td class="q na">-</td>';const m=String(o.a).match(/^(\d+(?:\.\d+)?)\s*(.*)$/);if(m&&m[2]==='ג׳')return`<td class="q">${m[1]}</td>`;return`<td class="q t">${esc(o.a)}</td>`};
  return`<div class="rg" style="--c:var(${c})"><h3><i></i>${title}</h3><table class="qt"><thead><tr><th>מוצר</th>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
    ${order.map(o=>`<tr><td>${esc(o.n)}${(o.w||o.x)?`<small>${sub(o.w,o.x)}</small>`:''}</td>${groupsList.map(gs=>cellOf(gs,o.id)).join('')}</tr>`).join('')}</tbody></table>
    <p class="muted" style="margin:0 0 12px">מספרים בגרמים, אלא אם כתוב אחרת.</p></div>`}

      <p class="vlist">או בלי לחם: <b>גביע יוגורט חלבון אחד</b>, עד 150 קל׳.</p></div>`;

function viewBackup(){
  const n=Object.keys(S.days).length;
  const last=S.lastExport?new Date(S.lastExport).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'}):null;
  const standalone=matchMedia('(display-mode: standalone)').matches;
  let h='';
  if(!storageOK)h+=`<div class="notice bad">${I.alert}<span>הדפדפן חוסם שמירה מקומית. הנתונים לא יישמרו בין פתיחות.</span></div>`;
  if(backupDue())h+=`<div class="notice warn">${I.alert}<span>מוצאי שבת עברו מאז הגיבוי האחרון.</span></div>`;
  h+=`<div class="jcard"><div class="bstat"><span class="num">${n}</span><p>ימים מתועדים<br>גיבוי אחרון: <b>${last||'עדיין לא'}</b></p></div>

    <div class="stack" style="margin-top:14px">
      ${navigator.canShare?`<button class="btn pri block" data-act="share">${I.share}שיתוף קובץ גיבוי (Drive, וואטסאפ)</button>`:''}
      <button class="btn ${navigator.canShare?'line':'pri'} block" data-act="export">${I.save}הורדת קובץ גיבוי</button>

  <div class="jcard"><div class="jhead"><h3>שחזור מגיבוי</h3></div>

    <div class="stack" style="margin-top:12px"><button class="btn line block" data-act="import">${I.upload}טעינת קובץ גיבוי</button></div></div>

   רינדור

const view=document.getElementById('view');
function render(){
  renderHead(); renderTabs();
  if(tab==='day')view.innerHTML=viewDay();
  else if(tab==='week')view.innerHTML=viewWeek();
  else if(tab==='rules')view.innerHTML=viewRules();
  else view.innerHTML=viewBackup();
}
let toastT, toastUndo=null;
function toast(msg,undo){const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">ביטול</button>':''}`;
  toastUndo=undo||null;t.style.pointerEvents=undo?'auto':'none';t.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('show');t.style.pointerEvents='none';toastUndo=null},undo?6000:2200)}
function undoable(d=cur){const before=S.days[d]?JSON.stringify(S.days[d]):null;return()=>{if(before)S.days[d]=JSON.parse(before);else delete S.days[d];save();render();toast('בוטל')}}
let persisted=null;
if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(v=>{persisted=v;if(tab==='backup')render()}).catch(()=>{});
function pageDay(n){cur=addD(cur,n);render();view.classList.remove('anim-next','anim-prev');void view.offsetWidth;view.classList.add(n>0?'anim-next':'anim-prev')}

/* ---------- גיבוי: ייצוא/ייבוא ---------- */
function backupFile(){const name=`menu-backup-${today()}.json`;return{name,blob:new Blob([JSON.stringify(S)],{type:'application/json'})}}
function doExport(){const{name,blob}=backupFile();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);S.lastExport=Date.now();save();render();toast('קובץ הגיבוי ירד')}
async function doShare(){const{name,blob}=backupFile();const f=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});S.lastExport=Date.now();save();render();toast('הגיבוי שותף')}else doExport()}catch(e){if(e.name!=='AbortError')doExport()}}
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result);if(!d||typeof d.days!=='object')throw 0}catch(err){toast('הקובץ אינו קובץ גיבוי של האפליקציה');return}
    openSheet({type:'restore',data:d})};
  rd.readAsText(f); e.target.value=''});

/* ---------- פעולות ---------- */
function act(a,v,el){
  switch(a){
    case'tab':tab=v;if(v==='week')wk=weekStart(cur);render();scrollTo(0,0);break;
    case'go':cur=v;render();break;
    case'dprev':pageDay(-1);break;
    case'dnext':pageDay(1);break;
    case'dtoday':cur=today();render();break;
    case'wprev':wk=addD(wk,-7);render();break;
    case'wnext':wk=addD(wk,7);render();break;
    case'wtoday':wk=weekStart(today());render();break;
    case'open':cur=v;tab='day';render();scrollTo(0,0);break;
    case'rtab':rulesTab=v;render();break;
    case'bool':haptic();upd(r=>{setP(r,v,!getP(r,v));if(v==='training'&&!r.training)r.loadingToday=false});break;
    case'lmode':upd(r=>{if(r.loading.mode!==v){r.loading.mode=v;r.loading.protein=r.loading.carb=r.loading.out=r.loading.fish=null}});break;
    case'milk':haptic();upd(r=>{r.milk=+v});break;
    case'freebie':haptic();upd(r=>{const i=r.freebies.indexOf(v);i<0?r.freebies.push(v):r.freebies.splice(i,1)});break;
    case'delfree':{const u=undoable();upd(r=>r.free.splice(+v,1));toast('הרישום נמחק',u);break}
    case'deldev':{const u=undoable();upd(r=>r.dev.splice(+v,1));toast('החריגה נמחקה',u);break}
    case'undo':if(toastUndo){const f=toastUndo;toastUndo=null;f()}break;
    case'pick':catTab={};openSheet({type:'pick',path:v});break;
    case'veg':openSheet({type:'veg',path:v});break;
    case'snack':openSheet({type:'snack'});break;
    case'snacksub':openSheet({type:'snacksub'});break;
    case'green':openSheet({type:'green'});break;
    case'addfree':openSheet({type:'free'});break;
    case'adddev':openSheet({type:'dev'});break;
    case'close':closeSheet();break;
    case'ctab':catTab[sheetSpec.path]=+v;renderSheet();sheetEl.querySelector('.sh-body').scrollTop=0;break;
    case'choose':{haptic();const p=sheetSpec.path, groups=CAT[p], o=findIn(groups,v), meal=p.split('.')[0];
      upd(r=>{setP(r,p,v);r.snap[p]={n:o.n,a:o.a,w:o.w};if(p.endsWith('protein')&&v!=='lean_fish')r[meal].fish=null});
      if(v!=='lean_fish')closeSheet(); break}
    case'fish':{haptic();const meal=sheetSpec.path.split('.')[0];upd(r=>{r[meal].fish=r[meal].fish===v?null:v});break}
    case'unpick':{const u=undoable();const p=sheetSpec.path,meal=p.split('.')[0];toast('הבחירה נוקתה',u);upd(r=>{setP(r,p,null);delete r.snap[p];if(p.endsWith('protein'))r[meal].fish=null});closeSheet();break}
    case'vmode':haptic();upd(r=>{const vv=getP(r,sheetSpec.path);if(vv.mode!==v){vv.mode=v;vv.items=[];delete vv.colorG}});break;
    case'vitem':upd(r=>{const a=getP(r,sheetSpec.path).items;const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)});break;
    case'vclear':{const u=undoable();upd(r=>setP(r,sheetSpec.path,vegBlank()));closeSheet();toast('הירקות נוקו',u);break}
    case'snackpick':{haptic();const o=SNACKS.find(x=>x.id===v);upd(r=>{if(r.snack.opt!==v){r.snack.opt=v;r.snack.sub=null;r.snack.green=null}r.snap['snack.opt']={n:o.n,a:o.a}});closeSheet();break}
    case'snackclear':toast('ארוחת הביניים בוטלה',undoable());upd(r=>{r.snack={opt:null,sub:null,green:null};delete r.snap['snack.opt']});closeSheet();break;
    case'snacksubpick':haptic();upd(r=>{r.snack.sub=v});closeSheet();break;
    case'greenpick':haptic();upd(r=>{r.snack.green=v});closeSheet();break;
    case'freesave':{const k=parseInt(document.getElementById('fk').value,10),d=document.getElementById('fd').value.trim();
      if(!(k>0)){document.getElementById('fk').focus();break}
      upd(r=>r.free.push({d,k}));closeSheet();toast(`נוספו ${k} קל׳`);break}
    case'devsave':{const d=document.getElementById('dv').value.trim();if(!d){document.getElementById('dv').focus();break}
      upd(r=>r.dev.push(d));closeSheet();toast('החריגה נרשמה');break}
    case'copyy':{const u=undoable(),y=ydayMeal(v);if(!y)break;haptic();
      upd(r=>{const m=r[v];m.veg={mode:y.veg.mode,items:[...(y.veg.items||[])]};m.protein=y.protein;m.fish=y.fish||null;
        const po=findIn(CAT[v+'.protein'],y.protein);r.snap[v+'.protein']={n:po.n,a:po.a,w:po.w};
        if(v==='dinner'){m.carb=y.carb;const co=findIn(DINNER_C,y.carb);r.snap['dinner.carb']={n:co.n,a:co.a,w:co.w}}});
      toast('הועתק מאתמול',u);break}
    case'cal':{const base=v==='day'?cur:wk;openSheet({type:'cal',target:v,m:base.slice(0,7)});break}
    case'calm':{const [y,m]=sheetSpec.m.split('-').map(Number);const d=new Date(y,m-1+(+v),1);sheetSpec.m=d.getFullYear()+'-'+pad(d.getMonth()+1);renderSheet();break}
    case'calpick':{if(sheetSpec.target==='day'){cur=v}else{wk=weekStart(v)}closeSheet();render();break}
    case'rmerge':{const d=sheetSpec.data;let n=0;for(const[k,val]of Object.entries(d.days||{})){if(!S.days[k]){S.days[k]=val;n++}}
      const ks=Object.keys(S.days).sort();if(ks.length&&ks[0]<S.start)S.start=ks[0];
      if(d.lastExport&&(!S.lastExport||d.lastExport>S.lastExport))S.lastExport=d.lastExport;
      save();closeSheet();render();toast(n?`נוספו ${n} ימים`:'לא היו ימים חסרים');break}
    case'rreplace':{const d=sheetSpec.data;S=Object.assign({v:2,start:today(),created:Date.now(),lastExport:null,days:{}},d);S.v=2;
      const ks=Object.keys(S.days).sort();if(ks.length&&ks[0]<S.start)S.start=ks[0];
      save();closeSheet();cur=today();wk=weekStart(cur);tab='day';render();toast('הנתונים הוחלפו מהקובץ');break}
    case'export':doExport();break;
    case'share':doShare();break;
    case'import':document.getElementById('importFile').click();break;
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();act(b.dataset.act,b.dataset.val,b)});
scrim.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetSpec)closeSheet();
  if(e.key==='Enter'&&sheetSpec&&e.target.matches('.sh-body input')){e.preventDefault();if(sheetSpec.type==='free')act('freesave');if(sheetSpec.type==='dev')act('devsave')}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='freeForm')act('freesave');if(e.target.id==='devForm')act('devsave')});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dpick'&&t.value){cur=t.value;render();return}
  if(t.id==='wh'||t.id==='wm'){const h=document.getElementById('wh').value;let m=document.getElementById('wm').value;
    if(!h){upd(r=>{r.wake=''});return} if(!m)m='00'; upd(r=>{r.wake=h+':'+m});return}
  if(t.id==='te'){upd(r=>{r.trainEnd=t.value});return}
});
// גרירת הגיליון למטה לסגירה
(()=>{let y0=null,dy=0;
  sheetEl.addEventListener('touchstart',e=>{const top=e.target.closest('.sh-top');const body=sheetEl.querySelector('.sh-body');if(top||(body&&body.scrollTop<=0&&e.target.closest('.sh-body'))){y0=e.touches[0].clientY;dy=0}else y0=null},{passive:true});
  sheetEl.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sheetEl.style.transition='none';sheetEl.style.transform=`translateY(${dy}px)`}},{passive:true});
  sheetEl.addEventListener('touchend',()=>{if(y0==null)return;sheetEl.style.transition='';sheetEl.style.transform='';if(dy>90)closeSheet();y0=null});
})();
(()=>{let t0=null;
  view.addEventListener('touchstart',e=>{t0=(tab==='day'&&!sheetSpec&&e.touches.length===1&&!e.target.closest('select,input,.seg,.chips,.recent'))?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
  view.addEventListener('touchend',e=>{if(!t0)return;const p=e.changedTouches[0],dx=p.clientX-t0.x,dy=p.clientY-t0.y;t0=null;
    if(Math.abs(dx)>=70&&Math.abs(dx)>Math.abs(dy)*2)pageDay(dx>0?1:-1)},{passive:true});
})();
{const qt=new URLSearchParams(location.search).get('tab');if(['day','week','rules','backup'].includes(qt))tab=qt}
setInterval(()=>{if(tab==='day'&&cur===today()&&!sheetSpec){const b=document.getElementById('fastbox');if(b)b.innerHTML=fastState(getDay(cur)).html}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheetSpec)render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
save(); render();
</script>
